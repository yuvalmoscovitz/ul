name: Feature proposal
description: Propose a focused product outcome
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: Do not include secrets, production traces, or customer data.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe what a user should be able to do, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or scope limits
