<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">UL finding preview</title>
  <desc id="description">A synthetic example where frustrated wording changes a subscription cancellation from end of billing period to immediate. The change appeared in three of three runs and needs human review.</desc>
  <rect width="1200" height="500" rx="24" fill="#111827"/>
  <rect x="40" y="34" width="1120" height="64" rx="12" fill="#1f2937"/>
  <circle cx="72" cy="66" r="8" fill="#f87171"/>
  <circle cx="98" cy="66" r="8" fill="#fbbf24"/>
  <circle cx="124" cy="66" r="8" fill="#34d399"/>
  <text x="160" y="75" fill="#f9fafb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700">UL finding preview</text>

  <text x="60" y="146" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">OBSERVED REQUEST</text>
  <text x="60" y="181" fill="#f9fafb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">Cancel at the end of this billing period.</text>
  <text x="60" y="218" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">Baseline: cancellation scheduled for period end</text>

  <path d="M60 254 H1140" stroke="#374151" stroke-width="2"/>
  <text x="60" y="298" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">CONTROLLED VARIATION · FRUSTRATED CUSTOMER</text>
  <text x="60" y="338" fill="#f9fafb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">Result: cancellation happened immediately</text>
  <text x="60" y="379" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700">Finding: cancellation timing changed</text>

  <rect x="60" y="414" width="252" height="48" rx="24" fill="#064e3b"/>
  <text x="86" y="445" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">SEEN IN 3/3 RUNS</text>
  <rect x="332" y="414" width="306" height="48" rx="24" fill="#78350f"/>
  <text x="359" y="445" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">NEEDS HUMAN REVIEW</text>
</svg>
