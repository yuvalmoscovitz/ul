<svg xmlns="http://www.w3.org/2000/svg" width="640" height="790" viewBox="0 0 640 790" role="img" aria-labelledby="title description">
  <title id="title">UL finding preview</title>
  <desc id="description">A synthetic example where frustrated wording changes a subscription cancellation from end of billing period to immediate. The change appeared in three of three runs and needs human review.</desc>
  <rect width="640" height="790" rx="24" fill="#111827"/>
  <rect x="28" y="28" width="584" height="78" rx="14" fill="#1f2937"/>
  <circle cx="58" cy="67" r="9" fill="#f87171"/>
  <circle cx="86" cy="67" r="9" fill="#fbbf24"/>
  <circle cx="114" cy="67" r="9" fill="#34d399"/>
  <text x="148" y="78" fill="#f9fafb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="31" font-weight="700">UL finding preview</text>

  <text x="40" y="156" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700">OBSERVED REQUEST</text>
  <text x="40" y="205" fill="#f9fafb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30">Cancel at the end of this</text>
  <text x="40" y="245" fill="#f9fafb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30">billing period.</text>
  <text x="40" y="298" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25">Baseline: scheduled for</text>
  <text x="40" y="334" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25">the end of the period</text>

  <path d="M40 377 H600" stroke="#374151" stroke-width="2"/>
  <text x="40" y="427" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700">CONTROLLED VARIATION</text>
  <text x="40" y="470" fill="#f9fafb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="29">Frustrated customer</text>
  <text x="40" y="530" fill="#f9fafb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27">Result: cancelled immediately</text>
  <text x="40" y="590" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="29" font-weight="700">Finding: cancellation</text>
  <text x="40" y="630" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="29" font-weight="700">timing changed</text>

  <rect x="40" y="681" width="244" height="64" rx="32" fill="#065f46"/>
  <text x="67" y="721" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700">SEEN IN 3/3</text>
  <rect x="304" y="681" width="296" height="64" rx="32" fill="#92400e"/>
  <text x="329" y="721" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="700">NEEDS REVIEW</text>
</svg>
