[project]
name = "ul-browser-use-adapter"
version = "0.1.0"
description = "Browser Use target adapter cookbook for UL"
requires-python = ">=3.12"
dependencies = ["ul"]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ul_browser_use_adapter"]

[tool.uv.sources]
ul = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "hatchling==1.31.0",
    "pyright>=1.1.380,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
extraPaths = ["src", "../../core/src", "../../sdk/src", "../../cli/src"]
