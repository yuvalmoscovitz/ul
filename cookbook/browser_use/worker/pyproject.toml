[project]
name = "ul-browser-use-worker"
version = "0.1.0"
description = "Isolated Browser Use runtime for the UL cookbook adapter"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
browser-use = ["browser-use[core]==0.13.7"]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ul_browser_use_worker"]

[dependency-groups]
dev = [
    "pyright>=1.1.380,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
extraPaths = ["src"]
